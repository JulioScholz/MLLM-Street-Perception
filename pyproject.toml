[project]
name = "mllm-street-perception"
version = "0.1.0"
description = "Multimodal LLM urban safety perception experiments on the SPECS dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "pandas",
    "pillow",
    "python-dotenv",
    "scikit-learn",
    "matplotlib",
    "rich",
    "ipykernel",
    "torchvision==0.23.0",
    "typer>=0.27.3",
    "click>=8.5.0",
    "tqdm>=4.70.1",
    "gptqmodel==5.0.0 ; sys_platform == 'linux'",
]

[tool.uv]
package = false
# torchao >=0.16 imports ScalingType from torch.nn.functional (torch >=2.11),
# which breaks on torch 2.8. 0.14.0 is the minimum gptqmodel requires.
constraint-dependencies = ["torchao==0.14.0"]

[tool.uv.extra-build-variables]
# gptqmodel's setup.py imports torch at build time and compiles CUDA kernels;
# skip the compile (no matching nvcc 12.8 on the server).
gptqmodel = { BUILD_CUDA_EXT = "0" }
