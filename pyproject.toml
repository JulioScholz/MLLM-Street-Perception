[project]
name = "mllm-street-perception"
version = "0.1.0"
description = "Multimodal LLM urban safety perception experiments on the SPECS dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "pandas",
    "pillow",
    "python-dotenv",
    "scikit-learn",
    "matplotlib",
    "rich",
    "ipykernel",
    "torchvision==0.23.0",
    "typer>=0.27.3",
    "click>=8.5.0",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false
